name: Registrar canciones

on:
  schedule:
    - cron: "7 * * * *"   # cada hora; la siguiente espera en fila
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registrar
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Registrar durante casi 6 horas
        run: |
          git config user.name "ravectrl-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          fin=$((SECONDS + 5*3600 + 45*60))
          while [ $SECONDS -lt $fin ]; do
            git pull --rebase --quiet || true
            python registrar.py || echo "Fallo la consulta, se reintenta en 3 min"
            git add canciones.csv
            if ! git diff --cached --quiet; then
              git commit -m "Nuevas canciones $(TZ=America/Mexico_City date '+%Y-%m-%d %H:%M')"
              git push || (git pull --rebase && git push) || true
            fi
            sleep 180
          done
